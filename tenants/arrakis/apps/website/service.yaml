# ClusterIP — mershab.com is fronted SAME-CLUSTER by an nginx Ingress on the
# arrakis edge (12-tenant-ingress) → web/website:80.
# No LoadBalancer, no LAN IP. Flat `web` namespace on arrakis
# (collapsed out of the mershab k3k vCluster).
apiVersion: v1
kind: Service
metadata:
  name: website
  namespace: web
spec:
  type: ClusterIP
  selector: {app: website}
  ports:
    - {name: http, port: 80, targetPort: 80}
