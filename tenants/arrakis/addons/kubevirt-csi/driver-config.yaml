# The kubevirt-csi-driver Namespace on the TENANT (arrakis) — home of the node
# DaemonSet (kubevirt-csi.yaml). The `driver-config` ConfigMap moved to the INFRA
# side (tenants/arrakis/infra/kubevirt-csi-controller.yaml) — the controller runs
# on mgmt now (Mode B) and is the only thing that reads it.
apiVersion: v1
kind: Namespace
metadata:
  name: kubevirt-csi-driver
