# Tenant StorageClass — `kubevirt` — backed by the bare-metal `fast-block`
# StorageClass (LocalPV-ZFS zvol). PVCs that request this class get a KubeVirt
# DataVolume that wraps a raw zvol on bare-metal (Block volumeMode via the CDI
# StorageProfile in clusters/baremetal/addons/kubevirt-hco/).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: kubevirt
  annotations:
    # Cluster default — charts that omit storageClass (vcluster, kagent
    # postgres, …) must not strand PVCs with no class at all.
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: csi.kubevirt.io
parameters:
  infraStorageClassName: fast-block
  bus: scsi
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
