# Tenant StorageClass — `kubevirt` — backed by the bare-metal `longhorn`
# StorageClass. PVCs that request this class get a KubeVirt DataVolume that
# wraps a Longhorn volume on bare-metal.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: kubevirt
  annotations:
    # Cluster default — charts that omit storageClass (vcluster, kagent
    # postgres, …) must not strand PVCs with no class at all.
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: csi.kubevirt.io
parameters:
  infraStorageClassName: longhorn
  bus: scsi
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
