# ServiceAccount + Role for the kubevirt-csi CONTROLLER to manage DataVolumes /
# VM hotplug on THIS (infra/mgmt) cluster, scoped to `tenants`. Mode B: the
# controller runs ON mgmt (tenants/arrakis/infra/kubevirt-csi-controller.yaml)
# and uses this SA IN-CLUSTER directly — no token/kubeconfig packing, no secret
# pushed to arrakis. (Its tenant-side access uses the CAPI `arrakis-kubeconfig`.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubevirt-csi
  namespace: tenants
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubevirt-csi
  namespace: tenants
rules:
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstances"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["subresources.kubevirt.io"]
    resources:
      - virtualmachineinstances/addvolume
      - virtualmachineinstances/removevolume
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubevirt-csi
  namespace: tenants
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubevirt-csi
subjects:
  - kind: ServiceAccount
    name: kubevirt-csi
    namespace: tenants
