# Local verification — same as CI runs.
# https://taskfile.dev
version: '3'

vars:
  KUBE_VERSION: '1.35.0'
  # Real source trees (the old sources/infrastructure/fleet/apps layout is gone).
  LINT_PATHS: 'platform clusters tenants bootstrap'
  # Kustomize roots that build standalone (secrets/ is skipped — its
  # *.secret.yaml are gitignored, so it never builds on a clean checkout).
  RENDER_ROOTS: 'platform/sveltos/clusterprofiles clusters/baremetal/infrastructure'

tasks:
  lint:
    desc: All linters — yamllint + kubeconform + flux check
    cmds:
      - task: lint:yaml
      - task: lint:kubeconform
      - task: lint:flux

  lint:yaml:
    desc: yamllint
    cmds:
      - yamllint -c .yamllint.yaml {{.LINT_PATHS}} 2>&1 | tee /tmp/yamllint.out || true
      - |
        if grep -q 'error' /tmp/yamllint.out; then
          exit 1
        fi

  lint:kubeconform:
    desc: kubeconform schema validation (skips kustomize composition)
    cmds:
      - |
        find {{.LINT_PATHS}} -name '*.yaml' -o -name '*.yml' 2>/dev/null \
          | xargs kubeconform \
              -kubernetes-version {{.KUBE_VERSION}} \
              -strict \
              -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{"{{"}}.Group{{"}}"}}/{{"{{"}}.ResourceKind{{"}}"}}_{{"{{"}}.ResourceAPIVersion{{"}}"}}.json' \
              -summary

  lint:flux:
    desc: flux check --pre (cluster-side requirements)
    cmds:
      - flux check --pre

  render:
    desc: kustomize build every buildable Kustomization → kubeconform
    cmds:
      - |
        for root in {{.RENDER_ROOTS}}; do
          if [ -f "$root/kustomization.yaml" ]; then
            echo "=== Rendering $root ==="
            kustomize build "$root" \
              | kubeconform \
                -kubernetes-version {{.KUBE_VERSION}} \
                -strict \
                -ignore-missing-schemas \
                -summary
          fi
        done

  policy:
    desc: kyverno test (no-op until policies/ exists)
    cmds:
      - |
        if [ -d "policies" ] && find policies -name 'kyverno-test.yaml' | grep -q .; then
          kyverno test policies/
        else
          echo "No policies/ yet — skipping (Phase 7+)"
        fi
