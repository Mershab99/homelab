# TEMPLATE — NetBird self-hosted management secrets. Dex/netbird moved to the HUB
# 2026-08-05, so this applies DIRECTLY to the hub `netbird` ns (was ns
# tenant-secrets + Sveltos-propagated to arrakis). *.secret.yaml is gitignored.
#
# SECURITY: keep REAL values ONLY in netbird-management-secrets.secret.yaml
# (gitignored). This example must hold placeholders — earlier it held live
# values (leaked into git history; ROTATE them).
#
# Generate:
#   NETBIRD_DATASTORE_ENC_KEY = openssl rand -base64 32
#   NETBIRD_RELAY_AUTH_SECRET = openssl rand -base64 32
#   NETBIRD_TURN_PASSWORD     = openssl rand -base64 32
#
# Copy to netbird-management-secrets.secret.yaml, fill, `./secrets/apply.sh`
# (lands in the hub `netbird` ns; the ns is created by the netbird chart —
# re-run apply.sh once the ClusterProfile has created it).
apiVersion: v1
kind: Secret
metadata:
  name: netbird-management-secrets
  namespace: netbird
type: Opaque
stringData:
  NETBIRD_DATASTORE_ENC_KEY: REPLACE_WITH_BASE64_32B
  NETBIRD_RELAY_AUTH_SECRET: REPLACE_WITH_BASE64_32B
  NETBIRD_TURN_PASSWORD: REPLACE_WITH_BASE64_32B
