# TEMPLATE — copy to velero-b2.secret.yaml, set the Backblaze B2 app key, then
# `./secrets/apply.sh`. *.secret.yaml is gitignored (never committed).
#
# Consumed by the velero chart (04b-backup.yaml) via credentials.existingSecret.
# The `cloud` key is the AWS-style credentials file the aws plugin reads; a B2
# application key drops straight in (B2 speaks S3).
#
# The velero namespace is pre-created by
# clusters/baremetal/infrastructure/namespaces.yaml — Sveltos must have synced
# it before apply.sh will succeed.
apiVersion: v1
kind: Secret
metadata:
  name: velero-b2
  namespace: velero
type: Opaque
stringData:
  cloud: |
    [default]
    aws_access_key_id = REPLACE_WITH_B2_KEY_ID
    aws_secret_access_key = REPLACE_WITH_B2_APPLICATION_KEY
