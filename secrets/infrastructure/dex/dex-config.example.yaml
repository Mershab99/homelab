# TEMPLATE — copy to dex-config.secret.yaml, fill the bcrypt hash + client
# secrets, then `./secrets/apply.sh`. Dex runs on the HUB (contraxia) now, so
# this lands DIRECTLY in the `dex` namespace on mgmt — NOT propagated to arrakis
# anymore (was ns tenant-secrets when Dex lived on the tenant). *.secret.yaml is
# gitignored.
#
# Dex reads its whole runtime config from this Secret (dex chart:
# configSecret.create=false, name=dex-config). Day-1 login is mershab/mershab —
# bcrypt it and change later. See README.md for the hash + per-client secrets and
# adding an upstream IdP later.
#
#   ADMIN_BCRYPT=$(htpasswd -bnBC 10 "" mershab | tr -d ':\n')
#   client secret = openssl rand -base64 32
apiVersion: v1
kind: Secret
metadata:
  name: dex-config
  namespace: tenant-secrets   # SOURCE on mgmt; propagated to arrakis `dex` ns (Dex on arrakis)
type: Opaque
stringData:
  config.yaml: |
    issuer: https://auth.mershab.com
    storage:
      type: kubernetes
      config:
        inCluster: true
    web:
      http: 0.0.0.0:5556
    enablePasswordDB: true
    staticPasswords:
      - email: mershab@integratrace.com
        hash: "REPLACE_WITH_BCRYPT_OF_mershab"
        username: mershab
        userID: "1"
    staticClients:
      # every vCluster apiserver (OIDC federation; arrakis itself is cert-auth)
      - id: kubernetes
        name: Kubernetes
        secret: "REPLACE_WITH_K8S_CLIENT_SECRET"
        redirectURIs:
          - http://localhost:8000
          - http://localhost:18000
      - id: grafana
        name: Grafana
        secret: "REPLACE_WITH_GRAFANA_CLIENT_SECRET"
        redirectURIs:
          - https://grafana.mershab.com/login/generic_oauth
      - id: coder
        name: Coder
        secret: "REPLACE_WITH_CODER_CLIENT_SECRET"
        redirectURIs:
          - https://coder.mershab.com/api/v2/users/oidc/callback
      # (netbird-client removed 2026-08-05 — Netbird ripped.)
