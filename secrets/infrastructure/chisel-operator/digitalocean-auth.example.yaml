# TEMPLATE — DigitalOcean API token for chisel-operator's ExitNodeProvisioner.
# Copy to digitalocean-auth.secret.yaml, fill the token (DO dashboard -> API ->
# generate a READ/WRITE token — write is required to create/destroy droplets),
# UNCOMMENT it in secrets/kustomization.yaml, then ./secrets/apply.sh.
# *.secret.yaml is gitignored.
#
# The ExitNodeProvisioner + this Secret must share a namespace (chisel v0.7.1
# resolves the annotation in the Service's ns) = the arrakis edge ns `ingress-nginx`.
# Applied to mgmt ns `tenant-secrets` as a SOURCE and PROPAGATED to the arrakis
# `ingress-nginx` ns by the tenant-secrets ClusterProfile.
apiVersion: v1
kind: Secret
metadata:
  name: digitalocean-auth
  namespace: tenant-secrets   # SOURCE on mgmt; propagated to arrakis ingress-nginx ns
type: Opaque
stringData:
  DIGITALOCEAN_TOKEN: REPLACE_WITH_DIGITALOCEAN_API_TOKEN
