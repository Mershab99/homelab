# TEMPLATE — DigitalOcean API token for chisel-operator's ExitNodeProvisioner.
# Copy to digitalocean-auth.secret.yaml, fill the token (DO dashboard -> API ->
# generate a READ/WRITE token — write is required to create/destroy droplets),
# UNCOMMENT it in secrets/kustomization.yaml, then ./secrets/apply.sh.
# *.secret.yaml is gitignored.
#
# Must live in chisel-operator-system (same namespace as the ExitNodeProvisioner).
# Contraxia consumes it directly here; the arrakis edge (Phase 2) gets its own
# copy propagated to arrakis' chisel-operator-system.
apiVersion: v1
kind: Secret
metadata:
  name: digitalocean-auth
  namespace: chisel-operator-system
type: Opaque
stringData:
  DIGITALOCEAN_TOKEN: REPLACE_WITH_DIGITALOCEAN_API_TOKEN
