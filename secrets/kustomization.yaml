# Deploy every mgmt cluster secret at once:  kubectl apply -k secrets/
#
# Lists the FILLED *.secret.yaml files (gitignored). Fill each from its
# *.example.yaml first (see README.md). kustomize errors on a missing file, so
# comment out any you haven't filled yet. Each Secret carries its own namespace.
#
# ALL secrets are applied to mgmt now — including the tenant-consumed ones, which
# land in the `tenant-secrets` ns and are propagated to arrakis by the
# `tenant-secrets` ClusterProfile (Sveltos templateResourceRefs). Nothing is
# applied against the arrakis context by hand anymore.
# (kubevirt-csi's infra-cluster-credentials is gone entirely — Mode B uses the
# CAPI-minted arrakis-kubeconfig, no secret.)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # mgmt-consumed
  - infrastructure/cert-manager/cloudflare-token.secret.yaml
  - infrastructure/external-dns/cloudflare-token.secret.yaml
  - infrastructure/grafana/grafana-oidc.secret.yaml
  - infrastructure/minio/loki-minio.secret.yaml
  # tenant-consumed SOURCES (ns tenant-secrets on mgmt) → propagated to arrakis
  - infrastructure/dex/dex-config.secret.yaml                     # → arrakis `dex` ns (Dex back on arrakis)
  - infrastructure/coder/coder-oidc.secret.yaml
  - infrastructure/chisel-operator/digitalocean-auth.secret.yaml  # → arrakis edge ns (DO ExitNodeProvisioner)
  # (Netbird secrets removed 2026-08-05 — Netbird ripped.)
