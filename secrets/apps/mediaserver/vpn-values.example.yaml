# Helm values fragment merged into the mediaserver chart by Sveltos
# (17-family-apps `valuesFrom`). Lives on MGMT (ns tenant-secrets) — never
# inside the vcluster. ROTATE the ProtonVPN OpenVPN creds before filling —
# the old pair was committed to the previous repo and is burned.
apiVersion: v1
kind: Secret
metadata:
  name: mediaserver-vpn-values
  namespace: tenant-secrets
type: Opaque
stringData:
  values.yaml: |
    transmission:
      config:
        openvpn:
          username: REPLACE_WITH_PROTONVPN_OPENVPN_USERNAME
          password: REPLACE_WITH_PROTONVPN_OPENVPN_PASSWORD
