# `lan` NAD in the HOST ns of the `ai` vcluster. vcluster pods sync to host
# here, and host multus resolves `k8s.v1.cni.cncf.io/networks: lan` against
# the HOST pod's namespace — the in-vcluster NAD (vcluster-baseline) is only
# for visibility inside the virtual API.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: lan
  namespace: vcluster-ai
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "lan",
      "type": "macvlan",
      "master": "br-multus",
      "mode": "bridge",
      "ipam": {
        "type": "dhcp"
      }
    }
