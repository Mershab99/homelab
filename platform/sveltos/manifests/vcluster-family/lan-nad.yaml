# `lan` NAD in the HOST ns of the `family` vcluster. vcluster pods sync to
# host here, and host multus resolves `k8s.v1.cni.cncf.io/networks: lan`
# against the HOST pod's namespace. (No NAD inside the vcluster — a plain
# vcluster has no NAD CRD; the annotation on the virtual pod is metadata the
# syncer copies.) Consumer: Home Assistant (17-family-apps).
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: lan
  namespace: vcluster-family
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "lan",
      "type": "macvlan",
      "master": "br-multus",
      "mode": "bridge",
      "ipam": {
        "type": "dhcp"
      }
    }
