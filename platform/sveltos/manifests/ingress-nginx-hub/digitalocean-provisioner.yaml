# DigitalOcean ExitNodeProvisioner — lives in the ingress-nginx namespace ON
# PURPOSE: chisel-operator v0.7.1 resolves a Service's
# `chisel-operator.io/exit-node-provisioner` annotation ONLY in that Service's
# own namespace (the ns/name form is ignored — verified 2026-08-05:
# CloudProvisionerNotFound, query=ingress-nginx/... despite a chisel-operator-system/
# prefix). So the provisioner (and its DO token Secret) must sit beside the
# nginx edge Service here, not in chisel-operator-system.
#
# Delivered by 02c-ingress-nginx (which owns this ns). Requires Secret
# `digitalocean-auth` (key DIGITALOCEAN_TOKEN) in THIS namespace.
apiVersion: chisel-operator.io/v1
kind: ExitNodeProvisioner
metadata:
  name: digitalocean-provisioner
  namespace: ingress-nginx
spec:
  DigitalOcean:
    auth: digitalocean-auth        # Secret name; key DIGITALOCEAN_TOKEN
    region: tor1                   # nearest DO region — adjust (tor1/nyc1/nyc3...)
    size: s-1vcpu-1gb              # cheapest; a chisel exit node needs no more
