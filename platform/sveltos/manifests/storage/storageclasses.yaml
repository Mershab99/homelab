# LocalPV-ZFS StorageClasses — all carve out of the "tank" pool (7x2 mirrors).
#
# fstype "zfs"  → native ZFS dataset (quota/compression/snapshots directly, no
#                 second filesystem on top of a COW block device).
# fstype "ext4" → zvol + ext4, for consumers that need block semantics
#                 (KubeVirt / kubevirt-csi hot-plug disks).
#
# WaitForFirstConsumer is moot on one node but stops being moot at two —
# set now, no migration later. ashift/volblocksize/recordsize are immutable
# per volume; recreate to change.
#
# Parameter names verified against zfs-localpv v2.11.0 (pkg/driver/controller.go
# reads poolname/fstype/thinprovision/recordsize/volblocksize; keys are matched
# case-insensitively). Provisioner name verified against the chart's csidriver.
#
# fast-zfs is THE cluster default. Longhorn — the previous default — is removed
# in the same change that lands this (platform/sveltos/clusterprofiles/
# 04-storage.yaml), so there is exactly one default class on the hub. The only
# other is-default-class in the repo is tenants/arrakis/addons/kubevirt-csi/
# storageclass.yaml, which is the `kubevirt` class on the ARRAKIS tenant
# cluster — a different cluster, not a conflict.
#
# The zfs-snapclass VolumeSnapshotClass is NOT here on purpose: it ships inside
# the piraeus snapshot-controller release so it cannot race its own CRD. See
# 04-storage.yaml.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast-zfs
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: zfs.csi.openebs.io
allowVolumeExpansion: true
reclaimPolicy: Retain          # real data by default — release, don't reap
volumeBindingMode: WaitForFirstConsumer
parameters:
  poolname: tank
  fstype: zfs
  thinprovision: "yes"
---
# Block-ish class for KubeVirt disks (kubevirt-csi DataVolumes hot-plug these
# into tenant VMs). 16k volblocksize suits general-purpose VM disks; a 4k-random
# workload would want its own class.
#
# This is the class the arrakis tenant reaches through: its `kubevirt`
# StorageClass sets infraStorageClassName: fast-block.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast-block
provisioner: zfs.csi.openebs.io
allowVolumeExpansion: true
reclaimPolicy: Delete          # tenant deletion should free hub storage
volumeBindingMode: WaitForFirstConsumer
parameters:
  poolname: tank
  fstype: ext4
  volblocksize: "16k"
  thinprovision: "yes"
---
# Postgres & friends — 16k recordsize matches DB page sizes; the 128k default
# is a read-modify-write amplifier under a database. Also carries the arrakis
# k0smotron etcd PVC (tenants/arrakis/infra/cluster.yaml).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: db-zfs
provisioner: zfs.csi.openebs.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
parameters:
  poolname: tank
  fstype: zfs
  recordsize: "16k"
  thinprovision: "yes"
