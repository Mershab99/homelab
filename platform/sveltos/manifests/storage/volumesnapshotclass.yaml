# CSI snapshot class for the tank pool — snapshots of ZFS datasets/zvols are
# near-free, which is the whole reason this cluster runs LocalPV-ZFS.
#
# ⚠️ WHY THIS IS A policyRef MANIFEST AND NOT A HELM VALUE.
#
# The obvious placement is the piraeus snapshot-controller chart's own
# `volumeSnapshotClasses` values list, so that Helm orders the CRD before the
# CR inside one release. That reasoning holds for charts that ship CRDs in the
# Helm-native `crds/` directory — Helm installs those in a separate, earlier
# pass. **snapshot-controller 5.2.0 does NOT.** Its six CRDs are rendered from
# `templates/crds.yaml`, i.e. the same manifest pass as
# `templates/volumesnapshotclass.yaml`. Verified by unpacking the chart:
#
#   $ helm pull piraeus/snapshot-controller --version 5.2.0 --untar
#   $ ls snapshot-controller/crds/          # EMPTY
#   $ ls snapshot-controller/templates/     # crds.yaml, volumesnapshotclass.yaml, ...
#
# Helm validates every object in a release against the API server before
# applying any of them, so on a cluster with no snapshot CRDs registered the
# install fails atomically:
#
#   resource mapping not found for name: "zfs-snapclass" ...
#   no matches for kind "VolumeSnapshotClass" in version "snapshot.storage.k8s.io/v1"
#   ensure CRDs are installed first
#
# Because the failure is atomic the CRDs never land, so the retry fails
# identically — a PERMANENT deadlock, not a first-reconcile race that settles.
# Observed live on contraxia 2026-08-25: 0 snapshot.storage.k8s.io CRDs and 0
# helm release secrets in kube-system, with the storage ClusterSummary stuck at
# Helm=Failed while Resources=Provisioned.
#
# Sveltos deploys the Helm feature and the Resources feature independently, so
# putting the class here breaks the cycle: the chart installs cleanly (CRDs
# included), and this manifest applies once those CRDs are registered.
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: zfs-snapclass
  annotations:
    # Only snapshot class on the hub; `longhorn` is gone, so there is no
    # wrong-driver class for a classless VolumeSnapshot to hit.
    snapshot.storage.kubernetes.io/is-default-class: "true"
  labels:
    # Velero (EnableCSI, 04b-backup) picks the class for a driver by this label
    # first, falling back to the default annotation.
    velero.io/csi-volumesnapshot-class: "true"
driver: zfs.csi.openebs.io
deletionPolicy: Delete
