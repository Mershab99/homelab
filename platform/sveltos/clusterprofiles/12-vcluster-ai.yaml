# vcluster-ai — the ONE virtual cluster (`ai`, Loft vcluster OSS), replacing
# k3k. Blast-radius boundary for the AI/MCP layer; every other workload is a
# flat namespace.
#
# SHARED-OPERATOR model (the resource win): kagent + kmcp + cert-manager run
# ONCE on the arrakis host (16-ai-helpers / 01-tls-stack). This vcluster syncs
# their CRs toHost (`sync.toHost.customResources`) — vcluster auto-copies each
# host CRD into the virtual cluster, tenants author CRs inside, the syncer
# lands them in host ns `vcluster-ai`, host operators reconcile. No operators
# duplicated per virtual cluster.
#
# API exposure: multiplex the ONE edge LB — nginx Ingress with SNI
# ssl-passthrough on 443 (k8s-ai.mershab.com; needs --enable-ssl-passthrough
# on the controller, set in 12-tenant-ingress). L4 passthrough keeps
# client-cert auth intact; same public-but-mTLS posture as arrakis 6443.
#
# Registration is hands-free: exportKubeConfig writes the kubeconfig Secret
# `ai-export-kubeconfig` (server rewritten to the edge hostname); the hub
# EventTrigger (clusters/baremetal/infrastructure/vcluster-autoregister.yaml)
# copies it to mgmt and creates the SveltosCluster (persona=ai) — then
# vcluster-baseline + oidc-rbac fan in via Sveltos as with any cluster.
#
# Selector: persona=platform (this profile deploys the vcluster ONTO arrakis;
# persona=ai profiles deploy INTO it once registered).
apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: vcluster-ai
spec:
  clusterSelector:
    matchLabels:
      persona: platform
  dependsOn:
    - tenant-baseline    # schedulable pods (CNI + CSI up)
    - tls-stack          # cert-manager CRDs on host (certificates/issuers sync)
    - ai-helpers         # kagent CRDs on host (kagent.dev CR sync)
    - tenant-ingress     # nginx IngressClass + ssl-passthrough for the API
  helmCharts:
    - repositoryURL: https://charts.loft.sh
      repositoryName: loft
      chartName: loft/vcluster
      chartVersion: 0.36.1          # PIN EXACT (sveltos v1.12 rejects wildcards)
      releaseName: ai
      releaseNamespace: vcluster-ai
      helmChartAction: Install
      values: |
        sync:
          toHost:
            # Host CRD is auto-copied into the vcluster for each entry; CR
            # instances sync out to host ns vcluster-ai where the SHARED host
            # operators (kagent, kmcp, cert-manager) reconcile them.
            customResources:
              agentharnesses.kagent.dev:
                enabled: true
              agents.kagent.dev:
                enabled: true
              mcpservers.kagent.dev:
                enabled: true
              memories.kagent.dev:
                enabled: true
              modelconfigs.kagent.dev:
                enabled: true
              modelproviderconfigs.kagent.dev:
                enabled: true
              remotemcpservers.kagent.dev:
                enabled: true
              sandboxagents.kagent.dev:
                enabled: true
              toolservers.kagent.dev:
                enabled: true
              certificates.cert-manager.io:
                enabled: true
              issuers.cert-manager.io:
                enabled: true
        controlPlane:
          distro:
            k8s:
              enabled: true
              apiServer:
                # OIDC federation to Dex — same flags as the arrakis-hosted
                # apiservers can't have (arrakis hosts Dex); vclusters are the
                # ONLY apiservers federated (drives 11-oidc-rbac, persona=ai).
                extraArgs:
                  - --oidc-issuer-url=https://auth.mershab.com
                  - --oidc-client-id=kubernetes
                  - --oidc-username-claim=email
                  - "--oidc-username-prefix=oidc:"
                  - --oidc-groups-claim=groups
                  - "--oidc-groups-prefix=oidc:"
          proxy:
            extraSANs:
              - k8s-ai.mershab.com
          ingress:
            # SNI ssl-passthrough through the one edge LB. Chart default
            # annotations already carry nginx ssl-passthrough + backend-protocol.
            enabled: true
            host: k8s-ai.mershab.com
            spec:
              ingressClassName: nginx
        exportKubeConfig:
          context: ai
          additionalSecrets:
            # Picked up by the hub EventSource (vcluster-autoregister); server
            # points at the edge so mgmt (and laptops) reach the API anywhere.
            - name: ai-export-kubeconfig
              context: ai
              server: https://k8s-ai.mershab.com:443
  policyRefs:
    # Host-ns `lan` NAD — vcluster pods materialize on host in vcluster-ai, so
    # multus resolves their NAD annotation THERE, not inside the vcluster.
    - kind: GitRepository
      name: homelab
      namespace: flux-system
      path: ./platform/sveltos/manifests/vcluster-ai
