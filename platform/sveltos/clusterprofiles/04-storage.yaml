# storage — ZFS pool ("tank") + OpenEBS LocalPV-ZFS on the R730.
#
# LONGHORN IS GONE. It used to be the first chart in this list; removing it is
# what makes Sveltos uninstall the release. That is deliberate and it is
# DESTRUCTIVE: do not let this profile reconcile until the operator has torn
# Longhorn down by hand and drained its three volumes. Order is
#   1. tear down Longhorn + its volumes (issue #3 / docs/runbooks)
#   2. upgrade the node to the zfs schematic + create the pool
#   3. merge this
# Reconciling out of order costs the arrakis tenant etcd. See "FIRST RECONCILE"
# at the bottom of this comment.
#
# The pool itself is below the GitOps line: 7x 2-way mirrors across 14 of the
# 15x 2TB Samsung SSDs (15th = warm spare), created once by
# bootstrap/zfs/create-pool.sh. Requires the zfs system extension in the Talos
# image (bootstrap/talos/r730-schematic.yaml) and the zfs_arc_max kernel arg.
# Until that image lands, zfs-localpv CrashLoops — no zfs binary on the host.
#
# LocalPV-ZFS is control-plane only — it issues zfs/zpool commands against the
# host kernel module; the pool survives chart uninstall (incl. Sveltos prune
# after a power cycle). Volumes are node-pinned (single node: free).
#
# SNAPSHOT OWNERSHIP — exactly one owner for the external-snapshotter CRDs and
# exactly one snapshot controller. Verified against both charts at these pins:
#   * piraeus snapshot-controller 5.2.0 (appVersion v8.6.0) installs the six
#     CRDs (volumesnapshot{,class,content} + volumegroupsnapshot{,class,content})
#     via installCRDs=true, and runs the controller with leaderElection=true.
#   * zfs-localpv 2.11.0 ships its OWN copy of both. Its `crds` subchart
#     renders csi-volume-snapshot{,-class,-content}.yaml under
#     `crds.csi.volumeSnapshots.enabled` (default true) — disabled below.
#     Its zfs-controller StatefulSet embeds a second snapshot-controller
#     container (registry.k8s.io/sig-storage/snapshot-controller:v8.2.0) under
#     `zfsController.snapshotController.enabled` (default true) — also disabled
#     below. Two controllers would race every cluster-scoped VolumeSnapshot.
# Chart order matters: piraeus is listed FIRST so the CRDs exist before
# zfs-localpv (which no longer carries them) is installed.
#
# The `zfs-snapclass` VolumeSnapshotClass rides the piraeus chart's own
# `volumeSnapshotClasses` values list rather than the policyRef manifest below.
# Sveltos deploys the Helm feature and the Resources feature independently —
# a VolumeSnapshotClass in the policyRef would race its own CRD on a first
# reconcile, and with continueOnError=false that failure takes the
# StorageClasses down with it. In-chart, Helm orders CRD before CR.
#
# persona=infra — storage runs on the bare-metal cluster; tenants consume it via
# kubevirt-csi (tenant-baseline bundle → hub class fast-block).
#
# FIRST RECONCILE, in order, assuming steps 1+2 above are done:
#   Helm feature   → snapshot-controller into kube-system (6 CRDs + controller
#                    + zfs-snapclass), then zfs-localpv into openebs (creates
#                    the namespace, zfs CRDs, controller + node DaemonSet).
#   Resources feature → 3 StorageClasses, the MinIO PVC/Deployment/Service/Job,
#                    and the tenants ResourceQuota.
#   fast-zfs becomes the cluster default StorageClass (nothing else claims it
#   once longhorn is gone).
apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: storage
spec:
  clusterSelector:
    matchLabels:
      persona: infra
  helmCharts:
    # ── external-snapshotter — one controller for every CSI driver here ──
    - repositoryURL: https://piraeus.io/helm-charts/
      repositoryName: piraeus
      chartName: piraeus/snapshot-controller
      chartVersion: 5.2.0   # EXACT (Sveltos v1.12 rejects .x wildcards) — appVersion v8.6.0
      releaseName: snapshot-controller
      releaseNamespace: kube-system
      helmChartAction: Install
      values: |
        # Defaults already correct: installCRDs=true, controller.enabled=true,
        # args.leaderElection=true, webhook.enabled=false (we have no legacy
        # v1beta1/v1beta2 VolumeGroupSnapshot objects to convert).
        #
        # CSI snapshots of ZFS datasets/zvols — near-free. Declared here, not in
        # the policyRef, so it lands in the same Helm release as its CRD.
        volumeSnapshotClasses:
          - name: zfs-snapclass
            driver: zfs.csi.openebs.io
            deletionPolicy: Delete
            annotations:
              # Only snapshot class on the hub; `longhorn` is gone, so there is
              # no wrong-driver class for a classless VolumeSnapshot to hit.
              snapshot.storage.kubernetes.io/is-default-class: "true"
            labels:
              # Velero (EnableCSI, 04b-backup) picks the class for a driver by
              # this label first, falling back to the default annotation.
              velero.io/csi-volumesnapshot-class: "true"
    # ── LocalPV-ZFS — the CSI driver for the tank pool ──
    - repositoryURL: https://openebs.github.io/zfs-localpv
      repositoryName: zfs-localpv
      chartName: zfs-localpv/zfs-localpv
      chartVersion: 2.11.0   # EXACT (Sveltos v1.12 rejects .x wildcards)
      releaseName: zfs-localpv
      releaseNamespace: openebs
      helmChartAction: Install
      values: |
        crds:
          zfsLocalPv:
            enabled: true    # zfsvolume/zfsnode/zfssnapshot/zfsbackup/zfsrestore — ours to own
          csi:
            volumeSnapshots:
              enabled: false   # external-snapshotter CRDs owned by the chart above
        zfsController:
          snapshotController:
            enabled: false     # second controller — see SNAPSHOT OWNERSHIP above
        zfsNode:
          # Chart default is /home/keys, mounted hostPath DirectoryOrCreate.
          # Talos has no /home and mounts / read-only, so the kubelet cannot
          # create it and the node DaemonSet never starts. /var is the only
          # writable host path on Talos.
          encrKeysDir: /var/openebs/zfs-localpv/keys
        analytics:
          enabled: false
  policyRefs:
    # StorageClasses + MinIO (Loki S3) + tenants-storage ResourceQuota as
    # native manifests. The VolumeSnapshotClass deliberately is NOT here.
    - kind: GitRepository
      name: homelab
      namespace: flux-system
      path: ./platform/sveltos/manifests/storage
