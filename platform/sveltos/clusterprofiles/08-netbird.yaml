# netbird — self-hosted NetBird SERVER on the HUB (contraxia). The private-access
# backbone. Moved off arrakis 2026-08-05 (Dex + netbird both live on the hub now).
#
# STAGE 1 (this file): management + dashboard + signal, OIDC federated to the hub
# Dex (auth.mershab.com, live). Exposed via the hub nginx edge (02c → chisel → DO
# droplet). Relay deferred to S1b; operator + routing-peer (API-over-mesh) to S2/S3.
#
# Secrets: netbird-management-secrets in THIS (netbird) ns — NETBIRD_DATASTORE_ENC_KEY
# (management store encryption). Dex has the `netbird-client` public/PKCE+device client.
#
# Selector: persona=infra.
apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: netbird
spec:
  clusterSelector:
    matchLabels:
      persona: infra
  dependsOn:
    - auth-stack          # Dex (auth.mershab.com) must exist to federate OIDC
    - ingress-nginx-hub   # the hub nginx edge (+ DO LB) fronts netbird/signal.mershab.com
  helmCharts:
    - repositoryURL: https://netbirdio.github.io/helms
      repositoryName: netbird
      chartName: netbird/netbird
      chartVersion: 1.9.0            # app 0.46.0; PIN EXACT (repo rule)
      releaseName: netbird
      releaseNamespace: netbird
      helmChartAction: Install
      values: |
        management:
          enabled: true
          # env: NB_SETUP_PAT_ENABLED lets the setup API mint the bootstrap PAT
          # headlessly (S2 operator). Store encryption key from the secret.
          env:
            NB_SETUP_PAT_ENABLED: "true"
          envRaw:
            - name: NETBIRD_DATASTORE_ENC_KEY
              valueFrom:
                secretKeyRef:
                  name: netbird-management-secrets
                  key: NETBIRD_DATASTORE_ENC_KEY
          # management.json — OIDC → hub Dex. Relay/TURN/Stun omitted in S1 (added
          # in S1b with their secrets); peers register + connect P2P via signal.
          configmap: |
            {
              "Signal": {"Proto":"https","URI":"signal.mershab.com:443"},
              "HttpConfig": {
                "AuthAudience": "netbird-client",
                "AuthIssuer": "https://auth.mershab.com",
                "AuthKeysLocation": "https://auth.mershab.com/keys",
                "AuthUserIDClaim": "sub",
                "OIDCConfigEndpoint": "https://auth.mershab.com/.well-known/openid-configuration"
              },
              "DeviceAuthorizationFlow": {
                "Provider": "hosted",
                "ProviderConfig": {
                  "Audience": "netbird-client",
                  "ClientID": "netbird-client",
                  "Domain": "auth.mershab.com",
                  "Scope": "openid profile email offline_access api"
                }
              },
              "PKCEAuthorizationFlow": {
                "ProviderConfig": {
                  "Audience": "netbird-client",
                  "ClientID": "netbird-client",
                  "Scope": "openid profile email offline_access api",
                  "RedirectURLs": ["https://netbird.mershab.com/peers","https://netbird.mershab.com/callback","https://netbird.mershab.com/silent-auth"]
                }
              }
            }
          # HTTP API (dashboard + REST) on netbird.mershab.com/api.
          ingress:
            enabled: true
            className: nginx
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
            hosts:
              - host: netbird.mershab.com
                paths:
                  - path: /api
                    pathType: Prefix
            tls:
              - secretName: netbird-mershab-tls
                hosts: [netbird.mershab.com]
          # Management gRPC (HTTP/2) on netbird.mershab.com — nginx needs the GRPC
          # backend protocol (chart's ingressGrpc sets it).
          ingressGrpc:
            enabled: true
            className: nginx
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              nginx.ingress.kubernetes.io/backend-protocol: GRPC
            hosts:
              - host: netbird.mershab.com
                paths:
                  - path: /management.ManagementService
                    pathType: Prefix
            tls:
              - secretName: netbird-mershab-tls
                hosts: [netbird.mershab.com]
        dashboard:
          enabled: true
          env:
            AUTH_AUTHORITY: https://auth.mershab.com
            AUTH_CLIENT_ID: netbird-client
            AUTH_AUDIENCE: netbird-client
            AUTH_SUPPORTED_SCOPES: openid profile email offline_access api
            USE_AUTH0: "false"
            AUTH_REDIRECT_URI: /peers
            AUTH_SILENT_REDIRECT_URI: /silent-auth
            NETBIRD_MGMT_API_ENDPOINT: https://netbird.mershab.com
            NETBIRD_MGMT_GRPC_API_ENDPOINT: https://netbird.mershab.com
          # SPA at the root of netbird.mershab.com.
          ingress:
            enabled: true
            className: nginx
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
            hosts:
              - host: netbird.mershab.com
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - secretName: netbird-mershab-tls
                hosts: [netbird.mershab.com]
        signal:
          enabled: true
          # signal gRPC on signal.mershab.com.
          ingressGrpc:
            enabled: true
            className: nginx
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              nginx.ingress.kubernetes.io/backend-protocol: GRPC
            hosts:
              - host: signal.mershab.com
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - secretName: signal-mershab-tls
                hosts: [signal.mershab.com]
        relay:
          enabled: false   # S1b — needs NETBIRD_RELAY_AUTH_SECRET wired
