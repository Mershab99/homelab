# Sveltos ClusterProfiles — multi-cluster delivery surface, organized as
# capability bundles. One profile per bundle, not per app. Selectors are the
# single `persona` label (infra | platform | ai); a few cross-persona bundles
# use `matchExpressions: persona In [...]`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 01-tls-stack.yaml           # cert-manager + ClusterIssuers
  - 01-dns.yaml                 # external-dns
  - 02-ingress-external.yaml    # chisel-operator + DigitalOcean ExitNodeProvisioner (ARRAKIS edge)
  - 03-multus.yaml              # secondary CNI (tenant-only; HCO gives mgmt Multus)
  - 03b-olm.yaml                # Operator Lifecycle Manager (for HCO + any future OLM operators)
  - 04-storage.yaml             # Longhorn (all 15 SSDs) + MinIO (Loki S3)
  - 04-virt-host.yaml           # KubeVirt HCO via OLM Subscription
  - 05-capi-stack.yaml          # cluster-api-operator + k0smotron providers
  # minimal: - 05b-cluster-autoscaler.yaml # CAS on mgmt; reads arrakis-kubeconfig auto-created by CAPI
  - 06-auth-stack.yaml          # Dex OIDC IdP on arrakis (platform); auth.mershab.com via the arrakis edge
  # 08-netbird.yaml removed 2026-08-05 — Netbird ripped; revisit later.
  - 09-db-operators.yaml        # vended DBs — CloudNativePG (Postgres) + MOCO (MySQL) operators
  - 10-tenant-secrets.yaml      # propagate mgmt-held tenant secrets → arrakis (templateResourceRefs)
  # minimal: - 07-observability-core.yaml  # prom-CRDs + OTel operator + DaemonSet collector
  # minimal: - 07-observability-backend.yaml  # Loki (MinIO S3) + Grafana operator + CR
  - 10-tenant-arrakis.yaml      # delivers CAPI resources for tenant cluster
  - 11-tenant-cilium.yaml       # tenant CNI (Sveltos-delivered, replaces HelmChartProxy)
  - 11-tenant-baseline.yaml     # tenant kubevirt-csi
  - 11-tenant-gpu.yaml          # NFD + GPU operator + NVIDIADriver CRs
  - 11-oidc-rbac.yaml           # ClusterRoleBindings (tenant + vClusters)
  - 12-tenant-ingress.yaml      # arrakis edge: ingress-nginx + chisel→DO (HTTP + TCP 6443 API)
  # Apps PARKED 2026-08-05 — their exposure was Traefik-Gateway / NetBird (both
  # ripped). Re-enable after migrating each to an nginx Ingress on the arrakis edge
  # (home-assistant stays LAN-only via its Multus NIC).
  # - 13-app-web.yaml
  # - 13-app-home-assistant.yaml
  # - 14-app-jellyfin.yaml
  # - 15-app-coder.yaml
  # vcluster reserved for the AI/MCP layer ONLY (family/mershab vClusters collapsed to flat ns).
  # Shared-operator model: kagent/kmcp/cert-manager run ONCE on the host; the
  # vcluster syncs their CRs toHost. Auto-registered via exportKubeConfig +
  # the hub EventTrigger (clusters/baremetal/infrastructure/vcluster-autoregister.yaml).
  - 12-vcluster-baseline.yaml   # in-vcluster NAD (persona=ai, fans in after registration)
  - 12-vcluster-ai.yaml         # the `ai` vcluster (Loft OSS) on arrakis + host-ns NAD
  - 16-ai-helpers.yaml          # kagent + KMCP on the HOST (shared operators)
