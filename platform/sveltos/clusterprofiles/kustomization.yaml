# Sveltos ClusterProfiles — multi-cluster delivery surface, organized as
# capability bundles. One profile per bundle, not per app. Selectors are the
# single `persona` label (infra | platform | ai); a few cross-persona bundles
# use `matchExpressions: persona In [...]`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 01-tls-stack.yaml           # cert-manager + ClusterIssuers
  - 01-dns.yaml                 # external-dns
  - 02-ingress-external.yaml    # chisel-operator + DigitalOcean ExitNodeProvisioner (ARRAKIS edge)
  - 03-multus.yaml              # secondary CNI (tenant-only; HCO gives mgmt Multus)
  - 03b-olm.yaml                # Operator Lifecycle Manager (for HCO + any future OLM operators)
  - 04-storage.yaml             # LocalPV-ZFS (tank pool) + MinIO (Loki S3)
  # Velero → B2. Uncomment after filling the B2 bucket/region in 04b-backup.yaml
  # and applying velero-b2.secret.yaml. MUST be enabled before real data lands.
  # - 04b-backup.yaml
  - 04-virt-host.yaml           # KubeVirt HCO via OLM Subscription
  - 05-capi-stack.yaml          # cluster-api-operator + k0smotron providers
  # minimal: - 05b-cluster-autoscaler.yaml # CAS on mgmt; reads arrakis-kubeconfig auto-created by CAPI
  - 06-auth-stack.yaml          # Dex OIDC IdP on arrakis (platform); auth.mershab.com via the arrakis edge
  # 08-netbird.yaml removed 2026-08-05 — Netbird ripped; revisit later.
  - 09-db-operators.yaml        # vended DBs — CloudNativePG (Postgres) + MOCO (MySQL) operators
  - 10-tenant-secrets.yaml      # propagate mgmt-held tenant secrets → arrakis (templateResourceRefs)
  # minimal: - 07-observability-core.yaml  # prom-CRDs + OTel operator + DaemonSet collector
  # minimal: - 07-observability-backend.yaml  # Loki (MinIO S3) + Grafana operator + CR
  - 10-tenant-arrakis.yaml      # delivers CAPI resources for tenant cluster
  - 11-tenant-cilium.yaml       # tenant CNI (Sveltos-delivered, replaces HelmChartProxy)
  - 11-tenant-baseline.yaml     # tenant kubevirt-csi
  - 11-tenant-gpu.yaml          # NFD + GPU operator + NVIDIADriver CRs
  - 11-oidc-rbac.yaml           # ClusterRoleBindings (tenant + vClusters)
  - 12-tenant-ingress.yaml      # arrakis edge: ingress-nginx + chisel→DO (HTTP + TCP 6443 API)
  # 15-app-coder still PARKED 2026-08-05 (Traefik-era exposure; needs an nginx
  # Ingress before re-enable). 13-app-web/13-app-home-assistant/14-app-jellyfin
  # deleted 2026-08-06 — superseded by the persona-vcluster app profiles below.
  # - 15-app-coder.yaml
  # Persona vclusters (Loft OSS) — one per persona, that persona's apps + MCP
  # servers inside (replaced the single `ai` vcluster 2026-08-06).
  # OSS vcluster = plain API isolation (generic CR sync AND certManager
  # integration are vCluster PRO) — kmcp runs INSIDE each vcluster; app
  # Ingresses sync toHost (OSS) so the one edge nginx + cert-manager +
  # external-dns serve them. Auto-registered via exportKubeConfig + the hub
  # EventTrigger (clusters/baremetal/infrastructure/vcluster-autoregister.yaml)
  # with labels persona=ai (any vcluster) + vcluster=<name> (this one).
  - 12-vcluster-family.yaml     # `family` vcluster on arrakis + host-ns lan NAD
  - 12-vcluster-mershab.yaml    # `mershab` vcluster on arrakis
  - 16-mcp-baseline.yaml        # kagent-crds + kmcp inside every vcluster (persona=ai)
  - 17-family-apps.yaml         # home-assistant (multus lan + velvet) + mediaserver + photoprism (vcluster=family)
  - 18-mershab-apps.yaml        # vaultwarden + website (vcluster=mershab)
  # Developer-experience workload on the hub itself (persona=infra), not a
  # tenant app — it is the thing that consumes the R730's idle 28 cores.
  # VIP assignments are tracked in docs/vip-allocation.md.
  - 19-orca-cell.yaml           # remote Orca server ("the cell"), VIP 192.168.2.241
  # Human-facing compute on the R730. Blocked on the ZFS storage classes —
  # dependsOn: storage.
  - 20-cpu-workspace.yaml       # `devbox` KubeVirt VM + SSH at 192.168.2.243
  # ── shamu platform port (2026-08-25) — the developer-experience tier moves off
  # the MacBook's OrbStack onto the R730. Ported from devex apps/shamu +
  # decisions #8-#14; the reconciliation (what was dropped and why) is in
  # docs/reports/2026-08-25-shamu-platform-port.md. All persona=infra.
  # NOTE: infra-db is 26- not 20-; 20 was taken by cpu-workspace in a parallel
  # track merged first. VIPs likewise shifted per docs/vip-allocation.md.
  - 26-infra-db.yaml            # CloudNativePG on the hub (forge + future kagent DB)
  - 21-forge.yaml               # Gitea 12.7.0 @ LB VIP 192.168.2.244 — the forge of record
  - 22-mcp-levers.yaml          # flux-operator-mcp (write) + kubernetes-mcp-server (read-only)
  - 23-kubewall.yaml            # cluster viewer — BYO SA bound to `view`, ClusterIP only
  # 24-kagent-router.yaml PARKED — Track D may own the kagent chart; enabling
  # both would have two ClusterProfiles fighting over one Helm release. Pick one
  # owner first. See the file header.
  # - 24-kagent-router.yaml
  # Tenant-side twin of 20-cpu-workspace: same job (SSH + Orca), on ARRAKIS, as
  # a StatefulSet rather than a VM (arrakis workers are already VMs — no nested
  # virt). ClusterIP only, reached by port-forward until the mesh lands.
  - 32-arrakis-devbox.yaml      # `devbox` StatefulSet + Orca server on arrakis
  # 25-vcluster-cell-TEMPLATE.yaml is a template, never listed. Copy it to spawn
  # a cell. CAPVC (devex decision #12) is DEAD here — contraxia runs CAPI core
  # v1.13.3 and CAPVC v0.2.2 caps at v1.10.x; see the template's header.
