# tenant-secrets — propagate mgmt-held secrets onto arrakis (persona=platform).
#
# The repo keeps secrets as plaintext applied by hand — but ONLY to mgmt
# (./secrets/apply.sh). This profile fans the tenant-consumed ones out to arrakis
# so a rebuild needs zero manual arrakis secret steps. templateResourceRefs read
# the mgmt sources; the tenant-secrets-templates ConfigMap (a Sveltos template,
# clusters/baremetal/infrastructure/tenant-secrets.yaml) renders copies into the
# real arrakis namespaces. Sveltos creates each target namespace if absent; the
# consumer chart binds the secret whenever it comes up.
#
# NOT SOPS/sealed/ESO — still plaintext-on-mgmt; Sveltos just copies. See
# secrets/README.md.
apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: tenant-secrets
spec:
  clusterSelector:
    matchLabels:
      persona: platform
  templateResourceRefs:
    - identifier: CF
      resource: {apiVersion: v1, kind: Secret, name: cloudflare-api-token, namespace: external-dns}
    - identifier: DEX
      resource: {apiVersion: v1, kind: Secret, name: dex-config, namespace: tenant-secrets}
    - identifier: CODER
      resource: {apiVersion: v1, kind: Secret, name: coder-oidc, namespace: tenant-secrets}
    - identifier: DO
      resource: {apiVersion: v1, kind: Secret, name: digitalocean-auth, namespace: tenant-secrets}
    # (Netbird refs removed 2026-08-05 — Netbird ripped.)
    # templateResourceRefs are all-or-nothing — a missing source FailsNonRetriable
    # the WHOLE profile.
  policyRefs:
    - kind: ConfigMap
      name: tenant-secrets-templates
      namespace: tenant-secrets
