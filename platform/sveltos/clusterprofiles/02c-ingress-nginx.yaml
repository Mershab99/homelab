# ingress-nginx-hub — the contraxia (hub) PUBLIC HTTP(S) edge.
#
# ONE ingress-nginx whose LoadBalancer Service is annotated for the DO
# ExitNodeProvisioner (02-ingress-external) → chisel-operator spins up ONE DO
# droplet exit node, bound 1:1. Every hub public hostname attaches as an Ingress
# on this class — auth.mershab.com (Dex root IdP), netbird.mershab.com / signal /
# relay (netbird server) — so it's ONE droplet, not one per service (respects
# chisel's 1:1 ExitNode<->Service rule). DO passes inbound 443; RackNerd did not.
#
# TLS terminates here via cert-manager (letsencrypt-prod, Cloudflare DNS-01 —
# 01-tls-stack runs on infra too) per-Ingress; external-dns (01-dns, infra)
# publishes each hostname to the LB's DO IP off the Ingress status.
#
# NOTE: netbird signal is gRPC + relay is websocket — both ride nginx via
# per-Ingress annotations (backend-protocol: GRPC / long proxy timeouts), set on
# the netbird Ingresses (08-netbird), not here.
#
# Selector: persona=infra. Mirror of the arrakis app edge (12-tenant-ingress,
# Phase 2) which replaces Traefik with this same chart.
apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: ingress-nginx-hub
spec:
  clusterSelector:
    matchLabels:
      persona: infra
  dependsOn:
    - tls-stack          # cert-manager + letsencrypt-prod for Ingress TLS
    - ingress-external   # chisel-operator + the DO ExitNodeProvisioner must exist
  helmCharts:
    - repositoryURL: https://kubernetes.github.io/ingress-nginx
      repositoryName: ingress-nginx
      chartName: ingress-nginx/ingress-nginx
      chartVersion: 4.15.1          # controller 1.15.1; PIN EXACT (repo rule)
      releaseName: ingress-nginx
      releaseNamespace: ingress-nginx
      helmChartAction: Install
      values: |
        controller:
          ingressClassResource:
            name: nginx
            default: true          # only IngressClass on the hub
          service:
            type: LoadBalancer
            # MUST set the chisel class so Cilium LB-IPAM (the 192.168.2.240-250
            # lan-pool) IGNORES this Service and leaves it for chisel-operator —
            # without it Cilium grabs a LAN IP (.241) and the DO annotation is moot.
            loadBalancerClass: chisel.mershab.com/external
            annotations:
              # chisel-operator auto-provisions a DO droplet exit node for this LB.
              # NAMESPACE/NAME form — the provisioner lives in chisel-operator-system,
              # not this Service's ns (ingress-nginx); bare name -> CloudProvisionerNotFound.
              chisel-operator.io/exit-node-provisioner: chisel-operator-system/digitalocean-provisioner
          # publish the DO LB address into Ingress status so external-dns can read
          # it off Ingresses attached to this controller.
          publishService:
            enabled: true
