# tenant-ingress — the ARRAKIS edge (nginx + chisel→DO). Replaces Traefik.
#
# ── ⚠️ NO LONGER THE *ONLY* EDGE IN THE ESTATE (changed 2026-08-25) ──
# This header used to call itself "the ONE ... edge" and asserted "'Expose
# arrakis via arrakis, save the contraxia edge'". The user reversed that: the
# hub now runs its own edge too, 27-ingress-hub.yaml, because the round-1 devex
# tier (Gitea, the Orca cell, the devbox) lives on contraxia and was stuck on
# bare LAN VIPs from a pool that overlaps the router's DHCP scope. Rationale:
# docs/reports/2026-08-25-contraxia-edge.md.
#
# Nothing about THIS profile changed — it is still the only edge for arrakis,
# still one LB → one droplet, and the two clusters' edges are independent
# (separate droplets, separate ExitNodeProvisioners, separate external-dns
# txtOwnerIds). Do not "consolidate" them: chisel-operator binds ONE Service per
# ExitNode and neither cluster can route the other's in-cluster Services.
#
# ONE ingress-nginx whose LoadBalancer Service is chisel-classed + DO-provisioned,
# so chisel-operator (02-ingress-external, on arrakis) spins up ONE DO droplet
# and binds it 1:1. That single LB carries EVERYTHING public for arrakis:
#   - HTTP 80/443 — Dex (auth.mershab.com) + apps (nginx Ingress, IngressClass nginx)
#   - TCP 6443    — the arrakis k8s API, L4 passthrough via nginx `tcp` services
#                   (6443 -> default/kubernetes:443 -> CP), so client-cert/mTLS is
#                   preserved. external-dns publishes k8s-home.mershab.com -> the DO IP
#                   off the controller Service annotation. Cert SAN already covers it.
#
# The arrakis CP stays hosted on contraxia (kmc-arrakis-lb 192.168.2.240, Cilium
# LAN, konnectivity + internal API) — this edge just tunnels the EXTERNAL
# kubectl + HTTP in through arrakis. That part is unchanged; only the "and
# therefore contraxia needs no edge" corollary was dropped (see the top).
#
# The DO ExitNodeProvisioner + digitalocean-auth secret live in THIS Service's ns
# (ingress-nginx) — chisel v0.7.1 resolves the provisioner in the Service's ns.
#
# Selector: persona=platform. (Apps migrate onto this nginx IngressClass
# incrementally; Traefik/Gateway-API + netbird-private are gone.)
apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: tenant-ingress
spec:
  clusterSelector:
    matchLabels:
      persona: platform
  dependsOn:
    - tenant-baseline    # schedulable pods (CNI + CSI up)
    - tls-stack          # cert-manager + letsencrypt-prod for Ingress TLS
    - ingress-external   # chisel-operator (arrakis) must exist to claim the LB
  helmCharts:
    - repositoryURL: https://kubernetes.github.io/ingress-nginx
      repositoryName: ingress-nginx
      chartName: ingress-nginx/ingress-nginx
      chartVersion: 4.15.1          # controller 1.15.1; PIN EXACT
      releaseName: ingress-nginx
      releaseNamespace: ingress-nginx
      helmChartAction: Install
      values: |
        controller:
          ingressClassResource:
            name: nginx
            default: true
          # SNI L4 passthrough for Ingresses annotated ssl-passthrough (the
          # vcluster APIs at k8s-family/k8s-mershab.mershab.com ride 443 this
          # way — multiplexing the one LB instead of burning a tcp: port each).
          extraArgs:
            enable-ssl-passthrough: "true"
          service:
            type: LoadBalancer
            loadBalancerClass: chisel.mershab.com/external   # chisel claims it, not Cilium
            annotations:
              chisel-operator.io/exit-node-provisioner: digitalocean-provisioner
              # publish the arrakis API hostname to the DO LB IP (external-dns
              # `service` source). Apps publish their own hostnames via Ingress.
              external-dns.alpha.kubernetes.io/hostname: k8s-home.mershab.com
          publishService:
            enabled: true
        # L4 TCP passthrough for the k8s API: nginx forwards raw 6443 to the
        # in-cluster kubernetes Service (-> CP 192.168.2.240:6443). No TLS
        # termination here, so client certs reach the apiserver intact.
        tcp:
          "6443": "default/kubernetes:443"
  policyRefs:
    # DigitalOcean ExitNodeProvisioner — MUST land in this profile's edge ns
    # (ingress-nginx) so chisel-operator finds it for the annotated LB Service.
    - kind: GitRepository
      name: homelab
      namespace: flux-system
      path: ./platform/sveltos/manifests/arrakis-edge
