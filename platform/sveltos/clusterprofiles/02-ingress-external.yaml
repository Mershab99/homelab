# ingress-external — chisel-operator + a DigitalOcean ExitNodeProvisioner on mgmt.
#
# The contraxia (hub) PUBLIC edge. chisel-operator auto-provisions a DO droplet
# exit node for any LoadBalancer Service annotated
#   chisel-operator.io/exit-node-provisioner: digitalocean-provisioner
# (see exit-nodes/digitalocean-provisioner.yaml). DO passes inbound 443; the old
# RackNerd VPS-01 did NOT (only 22+9090 — verified 2026-08-05), so the static
# node-01 ExitNode was retired. This edge fronts the netbird SERVER + Dex
# (auth.mershab.com / netbird.mershab.com).
#
# NOTE: the arrakis API no longer rides chisel — Phase 0 (2026-08-03) moved
# kmc-arrakis-lb to a Cilium LAN L2 IP (192.168.2.240). External kubectl to
# arrakis is via the Netbird overlay now.
#
# chisel-operator still binds ONE Service per ExitNode (1:1 — hard-learned
# 2026-07-16: two LB Services + one ExitNode flip-flop). So consolidate public
# HTTP(S) behind ONE nginx LoadBalancer here → one droplet, not many.
#
# Selector: persona=infra.
apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: ingress-external
spec:
  clusterSelector:
    matchLabels:
      persona: infra
  dependsOn:
    - tls-stack
  helmCharts:
    - repositoryURL: oci://ghcr.io/fyralabs/chisel-operator
      repositoryName: chisel-operator
      chartName: chisel-operator/chisel-operator
      chartVersion: v0.7.1
      releaseName: chisel-operator
      releaseNamespace: chisel-operator-system
      helmChartAction: Install
      values: |
        loadBalancerClass: chisel.mershab.com/external
  # No policyRefs — chisel-operator (chart only) watches LB Services cluster-wide
  # and creates ExitNodes on demand. The DigitalOcean ExitNodeProvisioner lives
  # beside each public-edge Service (e.g. ingress-nginx ns, via 02c-ingress-nginx),
  # because chisel-operator v0.7.1 resolves the provisioner in the Service's ns.
