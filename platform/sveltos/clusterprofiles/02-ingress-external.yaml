# ingress-external — chisel-operator on ARRAKIS (the ONLY edge; 2026-08-05).
#
# chisel-operator auto-provisions a DO droplet exit node for any LoadBalancer
# Service annotated
#   chisel-operator.io/exit-node-provisioner: digitalocean-provisioner
# DO passes inbound 443/6443; RackNerd VPS-01 did NOT (only 22+9090 — verified
# 2026-08-05). The arrakis nginx edge (12-tenant-ingress) is the one LB it serves:
# HTTP for Dex/apps + TCP 6443 for the arrakis k8s API (k8s-home.mershab.com).
# The ExitNodeProvisioner + digitalocean-auth secret live in that Service's ns
# (chisel v0.7.1 resolves the provisioner in the Service's ns).
#
# Moved off contraxia (was persona=infra): the hub keeps NO public edge — only the
# hosted CP + kmc-arrakis-lb (Cilium LAN L2 192.168.2.240, konnectivity + internal
# API endpoint). "Expose arrakis via arrakis" — one edge, on arrakis.
#
# chisel-operator binds ONE Service per ExitNode (1:1); consolidate behind the one
# nginx LB → one droplet.
#
# Selector: persona=platform (arrakis).
apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: ingress-external
spec:
  clusterSelector:
    matchLabels:
      persona: platform
  dependsOn:
    - tls-stack
  helmCharts:
    - repositoryURL: oci://ghcr.io/fyralabs/chisel-operator
      repositoryName: chisel-operator
      chartName: chisel-operator/chisel-operator
      chartVersion: v0.7.1
      releaseName: chisel-operator
      releaseNamespace: chisel-operator-system
      helmChartAction: Install
      values: |
        loadBalancerClass: chisel.mershab.com/external
  # No policyRefs — chisel-operator (chart only) watches LB Services cluster-wide
  # and creates ExitNodes on demand. The DigitalOcean ExitNodeProvisioner lives
  # beside the arrakis nginx edge Service (ingress-nginx ns, delivered by
  # 12-tenant-ingress) — chisel v0.7.1 resolves the provisioner in the Service's ns.
