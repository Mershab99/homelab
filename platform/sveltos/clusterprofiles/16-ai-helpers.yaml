# ai-helpers — kagent + KMCP INSIDE the `ai` vcluster (persona=ai, fans in
# after auto-registration). Single instance — the host runs NO kagent/kmcp.
#
# Why inside, not host-shared: generic CR sync toHost
# (sync.toHost.customResources) is a vCluster PRO feature, so host operators
# can't see in-vcluster kagent.dev CRs on OSS. cert-manager IS host-shared via
# the built-in certManager integration (12-vcluster-ai). Workload pods still
# materialize on the host via the syncer — the vcluster only isolates the API.
#
# kmcp-crds chart is DELIBERATELY absent: kmcp-crds 0.3.0 ships exactly one
# CRD (mcpservers.kagent.dev) that kagent-crds 0.9.12 also ships (same served
# versions, verified 2026-08-06) — two helm releases can't own one CRD, so
# kagent-crds owns it and the kmcp controller just consumes it.
#
# ── FILL ──
#   - A ModelConfig + its API-key Secret (secrets/infrastructure/kagent/)
#     applied inside the ai vcluster.
apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: ai-helpers
spec:
  clusterSelector:
    matchLabels:
      persona: ai
  helmCharts:
    # OCI: sveltos appends chartName to repositoryURL — base URL only here.
    - repositoryURL: oci://ghcr.io/kagent-dev/kagent/helm
      repositoryName: kagent-oci
      chartName: kagent-crds
      chartVersion: 0.9.12
      releaseName: kagent-crds
      releaseNamespace: kagent
      helmChartAction: Install
    - repositoryURL: oci://ghcr.io/kagent-dev/kagent/helm
      repositoryName: kagent-oci
      chartName: kagent
      chartVersion: 0.9.12
      releaseName: kagent
      releaseNamespace: kagent
      helmChartAction: Install
    - repositoryURL: oci://ghcr.io/kagent-dev/kmcp/helm
      repositoryName: kmcp-oci
      chartName: kmcp
      chartVersion: 0.3.0
      releaseName: kmcp
      releaseNamespace: kmcp-system
      helmChartAction: Install
