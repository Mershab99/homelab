# auth-stack — Dex, the SINGLE root IdP for the whole estate, on the HUB (contraxia).
#
# Moved off arrakis 2026-08-05 (was persona=platform). Collapsed to ONE Dex: the
# hub is the stable always-on cluster, so identity lives here and every app —
# hub, tenant (arrakis), and vClusters — federates to auth.mershab.com. No
# tenant-local Dex, no chaining. Downstream apps don't care where Dex runs; they
# only need the public issuer, which is reachable from anywhere via the hub edge.
#
# Served at auth.mershab.com by an nginx Ingress on the contraxia public edge
# (02c-ingress-nginx → chisel → DO droplet). TLS via cert-manager
# (letsencrypt-prod, Cloudflare DNS-01 — 01-tls-stack); external-dns publishes
# the record off the Ingress.
#
# Users + bcrypt'd passwords + per-app OAuth2 client registry live in a plaintext
# Secret `dex-config` in the `dex` namespace on THIS (hub) cluster, applied by
# hand via ./secrets/apply.sh (no longer propagated to arrakis) — see
# secrets/infrastructure/dex/README.md.
#
# Federation model: every downstream app gets its OWN staticClients entry
# (client_id + secret + redirect URIs). Adding an upstream IdP (GitHub/LLDAP)
# later touches only the Dex `connectors:` block, no app config.
#
# Clients (all in dex-config): kubernetes (tenant apiserver + every vCluster),
# grafana, coder, netbird. New apps add an entry when their profile lands.
#
# Selector: persona=infra.
apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: auth-stack
spec:
  clusterSelector:
    matchLabels:
      persona: infra
  dependsOn:
    - ingress-nginx-hub   # the hub nginx edge (+ its DO LB) fronts auth.mershab.com
  helmCharts:
    - repositoryURL: https://charts.dexidp.io
      repositoryName: dex
      chartName: dex/dex
      chartVersion: 0.19.x
      releaseName: dex
      releaseNamespace: dex
      helmChartAction: Install
      values: |
        # Dex reads its whole runtime config (connectors, staticClients,
        # staticPasswords) from the `dex-config` Secret (applied by hand). No
        # secrets in this values block.
        configSecret:
          create: false
          name: dex-config
        config:
          issuer: https://auth.mershab.com
          storage:
            type: kubernetes
            config:
              inCluster: true
          oauth2:
            skipApprovalScreen: true
            alwaysShowLoginScreen: false
        # Public route: nginx Ingress on the hub edge (was the tenant Traefik
        # Gateway when Dex ran on arrakis). cert-manager issues the TLS cert.
        ingress:
          enabled: true
          className: nginx
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
          hosts:
            - host: auth.mershab.com
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - hosts: [auth.mershab.com]
              secretName: auth-mershab-tls
        # ServiceMonitor flips on with observability-core.
        serviceMonitor:
          enabled: false
