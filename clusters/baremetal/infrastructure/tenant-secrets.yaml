# Tenant secret propagation — SOURCE side (on mgmt).
#
# `tenant-secrets` ns holds the tenant-only source secrets (applied by
# ./secrets/apply.sh on mgmt). The `tenant-secrets-templates` ConfigMap is a
# Sveltos template (annotation projectsveltos.io/template: ok) consumed by the
# `tenant-secrets` ClusterProfile (10-tenant-secrets.yaml): its templateResourceRefs
# read the mgmt-held source Secrets and these templates render copies onto arrakis
# (persona=platform). Result: a tenant rebuild needs ZERO manual secret steps on
# arrakis — apply.sh (mgmt) covers everything, Sveltos fans out.
#
# Sources read by the profile (all on mgmt):
#   external-dns/cloudflare-api-token   (reused — external-dns runs on mgmt too)
#   tenant-secrets/{dex-config,coder-oidc,netbird-management-secrets,netbird-operator,
#                   netbird-setup-key,node-02-credentials}  (tenant-only, ns here)
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-secrets
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-secrets-templates
  namespace: tenant-secrets
  annotations:
    projectsveltos.io/template: "ok"   # Sveltos renders the data below as Go templates
data:
  cloudflare.yaml: |
    apiVersion: v1
    kind: Secret
    metadata:
      name: cloudflare-api-token
      namespace: external-dns
    type: Opaque
    data:
      api-token: {{ index (getResource "CF").data "api-token" }}
  dex-config.yaml: |
    apiVersion: v1
    kind: Secret
    metadata:
      name: dex-config
      namespace: dex
    type: Opaque
    data:
      config.yaml: {{ index (getResource "DEX").data "config.yaml" }}
  coder-oidc.yaml: |
    apiVersion: v1
    kind: Secret
    metadata:
      name: coder-oidc
      namespace: coder
    type: Opaque
    data:
      client-secret: {{ index (getResource "CODER").data "client-secret" }}
  netbird-management-secrets.yaml: |
    apiVersion: v1
    kind: Secret
    metadata:
      name: netbird-management-secrets
      namespace: netbird
    type: Opaque
    data:
      NETBIRD_DATASTORE_ENC_KEY: {{ index (getResource "NBMGMT").data "NETBIRD_DATASTORE_ENC_KEY" }}
      NETBIRD_RELAY_AUTH_SECRET: {{ index (getResource "NBMGMT").data "NETBIRD_RELAY_AUTH_SECRET" }}
      NETBIRD_TURN_PASSWORD: {{ index (getResource "NBMGMT").data "NETBIRD_TURN_PASSWORD" }}
  # netbird-operator.yaml + netbird-setup-key.yaml added here once NetBird is up
  # (their sources come FROM the NetBird dashboard; re-add the NBOP/NBKEY
  # templateResourceRefs in 10-tenant-secrets.yaml at the same time).
  node-02-credentials.yaml: |
    apiVersion: v1
    kind: Secret
    metadata:
      name: node-02-credentials
      namespace: chisel-operator-system
    type: Opaque
    data:
      auth: {{ index (getResource "NODE02").data "auth" }}
