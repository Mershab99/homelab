# Namespaces. Sveltos and its prereq sit here; the rest (cert-manager,
# kubevirt, capi-system, traefik, external-dns,
# chisel-operator-system) are created by the Sveltos ClusterProfile that
# installs the corresponding chart.
apiVersion: v1
kind: Namespace
metadata:
  name: projectsveltos
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
# OpenEBS LocalPV-ZFS needs privileged PSA (node plugin drives kernel ZFS on
# the host). Pre-created here so the label is set before the storage
# ClusterProfile installs the chart.
apiVersion: v1
kind: Namespace
metadata:
  name: openebs
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
# Velero node-agent (kopia data mover) mounts kubelet pod dirs — privileged.
# Pre-created so the velero-b2 Secret (secrets/apply.sh) can land before the
# 04b-backup ClusterProfile installs the chart.
apiVersion: v1
kind: Namespace
metadata:
  name: velero
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
# tenants/ holds CAPI Cluster CRs delivered by Sveltos to mgmt — keep here
# so the namespace exists before the ClusterProfile reconciles.
apiVersion: v1
kind: Namespace
metadata:
  name: tenants
---
# The Orca cell (19-orca-cell). Pre-created here, not in the ClusterProfile's
# payload, so the hand-applied `gitea-pull` imagePullSecret has somewhere to land
# before the StatefulSet first schedules — same reasoning as `velero` above.
# No PSA label: the pod is uid 1000, no caps, no hostPath.
apiVersion: v1
kind: Namespace
metadata:
  name: cell
---
# Gitea Actions runner (34-forge-runner). Two reasons this is pre-created rather
# than left to the Helm release:
#   1. The chart's dind sidecar renders `privileged: true` unconditionally
#      (`statefulset.dind.rootless: true` does NOT change it — verified by
#      rendering chart 0.1.2 both ways), and Talos enforces PodSecurity
#      `baseline` on every namespace but kube-system, which forbids exactly
#      that. Without the label below the runner pod is rejected at admission.
#   2. The hand-applied `gitea-runner-token` Secret needs somewhere to land
#      before the profile reconciles.
# It is NOT the `gitea` namespace on purpose: relaxing PSA for the runner should
# not relax it for the forge and its Postgres.
apiVersion: v1
kind: Namespace
metadata:
  name: forge-runner
  labels:
    pod-security.kubernetes.io/enforce: privileged
