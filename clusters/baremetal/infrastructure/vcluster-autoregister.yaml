# vcluster auto-registration — hands-free SveltosCluster creation for every
# vcluster that exports a kubeconfig (12-vcluster-* `exportKubeConfig`).
#
# Flow (Sveltos event framework, all on the hub):
#   1. EventSource matches Secrets named *-export-kubeconfig on managed
#      clusters (persona=platform, i.e. arrakis) and COLLECTS them, so the
#      template below sees .Resource.data.
#   2. EventTrigger deploys the instantiated template into the mgmt cluster
#      itself (destinationCluster = SveltosCluster mgmt/mgmt): a copy of the
#      kubeconfig Secret + the SveltosCluster (persona=ai + vcluster=<name>)
#      referencing it → oidc-rbac + mcp-baseline + the per-persona apps
#      profile fan in.
#      (NOT secretGenerator — generators reference template Secrets that must
#      already exist in the MGMT cluster; they cannot read the event resource.)
#
# Convention: export secret MUST be named <vcluster>-export-kubeconfig; the
# SveltosCluster is registered as projectsveltos/<vcluster>.
apiVersion: lib.projectsveltos.io/v1beta1
kind: EventSource
metadata:
  name: vcluster-exported-kubeconfig
spec:
  collectResources: true
  resourceSelectors:
    - group: ""
      version: v1
      kind: Secret
      evaluate: |
        function evaluate()
          hs = {}
          hs.matching = false
          if string.match(obj.metadata.name, "%-export%-kubeconfig$") then
            hs.matching = true
          end
          return hs
        end
---
apiVersion: lib.projectsveltos.io/v1beta1
kind: EventTrigger
metadata:
  name: vcluster-autoregister
spec:
  sourceClusterSelector:
    matchLabels:
      persona: platform
  eventSourceName: vcluster-exported-kubeconfig
  oneForEvent: true
  syncMode: Continuous
  # Deploy the rendered Secret+SveltosCluster INTO the mgmt cluster
  # (registered as mgmt/mgmt).
  destinationCluster:
    apiVersion: lib.projectsveltos.io/v1beta1
    kind: SveltosCluster
    name: mgmt
    namespace: mgmt
  policyRefs:
    - kind: ConfigMap
      name: vcluster-sveltoscluster-template
      namespace: projectsveltos
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vcluster-sveltoscluster-template
  namespace: projectsveltos
  annotations:
    projectsveltos.io/instantiate: "ok"   # render with event data
data:
  sveltoscluster.yaml: |
    apiVersion: v1
    kind: Secret
    metadata:
      name: "{{ .Resource.metadata.name }}"
      namespace: projectsveltos
    type: Opaque
    data:
      config: {{ index .Resource.data "config" }}
    ---
    apiVersion: lib.projectsveltos.io/v1beta1
    kind: SveltosCluster
    metadata:
      name: "{{ trimSuffix "-export-kubeconfig" .Resource.metadata.name }}"
      namespace: projectsveltos
      labels:
        # persona=ai == "any vcluster" — shared bundles (16-mcp-baseline,
        # 11-oidc-rbac) fan into every one. vcluster=<name> targets ONE
        # (17-family-apps → family, 18-mershab-apps → mershab).
        persona: ai
        vcluster: "{{ trimSuffix "-export-kubeconfig" .Resource.metadata.name }}"
    spec:
      kubeconfigName: "{{ .Resource.metadata.name }}"
      kubeconfigKeyName: config
